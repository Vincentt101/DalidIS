<script type="module">
  // ---- Firebase setup ----
  // Paste your own project's config here (from the Firebase console: Project settings > General > Your apps > SDK setup and configuration).
  // Until this is filled in with real values, the app runs in "local only" mode: everything works, but saves only to this one browser (same as before).
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyC1O8koWHLUh-3arpLsm7bkemVZL3p-bIQ",
    authDomain: "dalid-is.firebaseapp.com",
    databaseURL: "https://dalid-is-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dalid-is",
    storageBucket: "dalid-is.firebasestorage.app"
  };
  var STATE_PATH = 'dalidjhs/state';

  function isConfigured(){
    return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('YOUR_') !== 0;
  }

  if(!isConfigured()){
    window.__fb = null;
    window.dispatchEvent(new Event('fb-ready'));
  }else{
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js").then(function(appMod){
      return Promise.all([
        appMod,
        import("https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js"),
        import("https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js")
      ]);
    }).then(function(mods){
      var appMod = mods[0], dbMod = mods[1], storageMod = mods[2];
      var app = appMod.initializeApp(FIREBASE_CONFIG);
      var db = dbMod.getDatabase(app);
      var storage = storageMod.getStorage(app);
      var stateRef = dbMod.ref(db, STATE_PATH);
      window.__fb = {
        setState: function(state){ return dbMod.set(stateRef, state); },
        onState: function(cb){
          return dbMod.onValue(stateRef, function(snap){ cb(snap.val()); }, function(err){ console.error('Dalid JHS live sync error', err); });
        },
        uploadFile: function(path, blob){
          var fref = storageMod.ref(storage, path);
          return storageMod.uploadBytes(fref, blob).then(function(){ return storageMod.getDownloadURL(fref); });
        }
      };
      window.dispatchEvent(new Event('fb-ready'));
    }).catch(function(err){
      console.error('Firebase failed to load', err);
      window.__fb = null;
      window.dispatchEvent(new Event('fb-ready'));
    });
  }
</script>

    --tag-teal-bg:#3A1A29; --tag-teal-fg:#F090BC; --tag-teal-grad:linear-gradient(135deg,#A3396E 0%,#6E2049 100%);
    --tag-slate-bg:#242C36; --tag-slate-fg:#A9BAD1;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance; color:var(--ink);}
  p{margin:0;}
  button{font-family:inherit; font-size:inherit; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:inherit; color:var(--ink);}
  a{color:var(--primary);}
  ::selection{background:var(--primary-soft); color:var(--ink);}
  .icon{width:17px;height:17px;flex:none;display:block;}
  .icon-sm{width:14px;height:14px;}

  /* ---- Welcome / cover ---- */
  .cover{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:var(--sp-6); gap:var(--sp-5);
    background:
      radial-gradient(circle at 18% 22%, var(--tag-rust-bg) 0%, transparent 42%),
      radial-gradient(circle at 82% 18%, var(--tag-mustard-bg) 0%, transparent 40%),
      radial-gradient(circle at 20% 82%, var(--tag-teal-bg) 0%, transparent 42%),
      radial-gradient(circle at 84% 80%, var(--tag-plum-bg) 0%, transparent 42%),
      var(--bg);
  }
  .cover-logo{width:118px; height:118px; background-image:var(--logo-img); background-size:contain; background-repeat:no-repeat; background-position:center; filter:drop-shadow(0 6px 16px var(--shadow-lg));}
  .cover-eyebrow{font-size:0.78rem; text-transform:uppercase; letter-spacing:0.18em; color:var(--muted); font-weight:600;}
  .cover-title{font-size:clamp(2.2rem, 6vw, 3.6rem); max-width:16ch; line-height:1.05;}
  .cover-sub{color:var(--ink-soft); font-size:1rem; max-width:38ch;}
  .cover-dots{display:flex; gap:10px; margin:var(--sp-2) 0;}
  .cover-dot{width:11px;height:11px;border-radius:50%;}
  .cover-enter{
    margin-top:var(--sp-3); display:inline-flex; align-items:center; gap:9px;
    padding:14px 28px; border-radius:99px; border:none; background:var(--primary); color:var(--on-primary);
    font-weight:700; font-size:0.95rem; cursor:pointer; box-shadow:0 10px 30px var(--shadow-lg);
  }
  .cover-enter:hover{opacity:0.93;}
  .cover-foot{color:var(--muted); font-size:0.78rem; margin-top:var(--sp-4);}
  .login-form{display:flex; flex-direction:column; align-items:center; gap:var(--sp-2); width:100%; max-width:220px;}
  .login-form .field{width:100%; text-align:left;}
  .login-pin-input{text-align:center; letter-spacing:0.4em; font-size:1.1rem; font-family:var(--font-mono);}
  .login-error{display:flex; align-items:center; gap:6px; color:var(--danger); font-size:0.82rem; font-weight:600;}
  .signed-in-as{font-size:0.82rem; color:var(--ink-soft); white-space:nowrap; background:transparent; border:none; padding:0; font-family:inherit;}
  .signed-in-as b{color:var(--ink);}
  .signed-in-as-link{cursor:pointer; border-radius:var(--radius-sm);}
  .signed-in-as-link:hover{color:var(--accent);}
  .signed-in-as-link:hover b{color:var(--accent);}
  .header-actions{display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:flex-end;}
  .teacher-list{display:flex; flex-direction:column; gap:2px; max-height:320px; overflow-y:auto;}
  .teacher-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border-soft);}
  .teacher-row:last-child{border-bottom:none;}
  .teacher-row-name{font-weight:600; font-size:0.92rem;}
  .teacher-row-name-link{cursor:pointer;}
  .teacher-row-name-link:hover{color:var(--accent);}
  .chat-list{display:flex; flex-direction:column; gap:10px; max-height:360px; overflow-y:auto;}
  .chat-msg{padding:9px 12px; border-radius:var(--radius-md); background:var(--surface-2);}
  .chat-msg-you{background:var(--good-soft);}
  .chat-msg-head{display:flex; align-items:center; gap:8px; font-size:0.76rem; color:var(--muted); margin-bottom:3px;}
  .chat-msg-head b{color:var(--ink); font-size:0.82rem;}
  .chat-msg-head .icon-btn{margin-left:auto; width:22px; height:22px;}
  .chat-msg-text{font-size:0.88rem; color:var(--ink-soft); white-space:pre-wrap; word-break:break-word;}
  .chat-panel{position:fixed; bottom:96px; right:20px; width:320px; max-width:calc(100vw - 24px); height:440px; max-height:calc(100vh - 116px); background:var(--surface); border-radius:16px; box-shadow:0 16px 44px rgba(0,0,0,0.28); display:flex; flex-direction:column; overflow:hidden; z-index:150; border:1px solid var(--border); animation:pop-in 0.22s cubic-bezier(.2,.9,.25,1);}
  .chat-fab{position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%; background:var(--primary); color:var(--on-primary); border:none; box-shadow:0 8px 24px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:120; transition:transform 0.18s cubic-bezier(.2,.9,.25,1), box-shadow 0.18s ease;}
  .chat-fab:hover{transform:scale(1.07); box-shadow:0 10px 28px rgba(0,0,0,0.35);}
  .chat-fab:active{transform:scale(0.96);}
  .chat-fab .icon{width:28px; height:28px;}
  .chat-fab-dot{position:absolute; top:8px; right:8px; width:12px; height:12px; border-width:2px;}
  .chat-panel-head{background:var(--primary); color:var(--on-primary); padding:12px 8px 12px 16px; display:flex; align-items:center; justify-content:space-between; font-weight:700; font-family:var(--font-display); font-size:0.95rem; flex:none;}
  .chat-panel-head .icon-btn{background:transparent; border:none; color:var(--on-primary);}
  .chat-panel-head .icon-btn:hover{background:rgba(255,255,255,0.18);}
  .chat-panel-body{flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; background:var(--bg);}
  .chat-empty{margin:auto; text-align:center; color:var(--muted); font-size:0.85rem; line-height:1.5;}
  .bubble-row{display:flex; flex-direction:column; max-width:78%; margin-bottom:8px;}
  .bubble-row-you{align-self:flex-end; align-items:flex-end;}
  .bubble-row:not(.bubble-row-you){align-self:flex-start; align-items:flex-start;}
  .bubble-sender{font-size:0.68rem; font-weight:600; color:var(--muted); margin:0 0 3px 11px;}
  .bubble{position:relative; padding:8px 13px; border-radius:16px; font-size:0.87rem; line-height:1.4; background:var(--surface-2); color:var(--ink); word-break:break-word; white-space:pre-wrap;}
  .bubble-you{background:var(--primary); color:var(--on-primary); padding-right:28px;}
  .bubble-del{position:absolute; top:5px; right:5px; width:16px; height:16px; border:none; background:transparent; color:inherit; opacity:0.65; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .bubble-del:hover{opacity:1;}
  .bubble-time{font-size:0.65rem; color:var(--muted); margin:3px 0 0 11px;}
  .bubble-time-you{margin:3px 11px 0 0;}
  .chat-panel-foot{display:flex; align-items:center; gap:8px; padding:10px; border-top:1px solid var(--border); background:var(--surface); flex:none;}
  .chat-panel-foot .input{flex:1; border-radius:20px;}
  .chat-send-btn{width:34px; height:34px; border-radius:50%; border:none; background:var(--primary); color:var(--on-primary); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; padding:0;}
  .chat-attach-btn{border-radius:50%; flex:none;}
  .bubble-attachment{margin-top:4px;}
  .bubble-attachment .attachment-chip{background:rgba(255,255,255,0.18); color:inherit;}
  .bubble:not(.bubble-you) .bubble-attachment .attachment-chip{background:var(--accent-soft); color:var(--accent);}
  .chat-send-btn:hover{opacity:0.9;}
  .notif-panel{position:fixed; top:58px; right:20px; width:340px; max-width:calc(100vw - 24px); max-height:min(480px, calc(100vh - 78px)); background:var(--surface); border-radius:14px; box-shadow:0 16px 44px rgba(0,0,0,0.28); display:flex; flex-direction:column; overflow:hidden; z-index:150; border:1px solid var(--border); animation:pop-in 0.22s cubic-bezier(.2,.9,.25,1);}
  .notif-panel-head{padding:14px 16px; font-weight:700; font-family:var(--font-display); font-size:1.05rem; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border-soft); flex:none;}
  .notif-panel-head .icon-btn{background:transparent; border:none;}
  .notif-panel-body{overflow-y:auto; flex:1;}
  .notif-row{display:flex; align-items:flex-start; gap:10px; padding:11px 16px; border-bottom:1px solid var(--border-soft);}
  .notif-row:last-child{border-bottom:none;}
  .notif-unread{background:var(--tag-blue-bg);}
  .notif-icon{width:34px; height:34px; border-radius:50%; background:var(--primary); color:var(--on-primary); display:flex; align-items:center; justify-content:center; flex:none;}
  .notif-body{flex:1; min-width:0;}
  .notif-text{font-size:0.86rem; line-height:1.4; color:var(--ink);}
  .notif-time{font-size:0.74rem; color:var(--primary); font-weight:600; margin-top:3px;}
  .notif-dot{width:9px; height:9px; border-radius:50%; background:var(--primary); flex:none; margin-top:6px;}
  .badge-icon-btn{position:relative;}
  .chat-dot{position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%; background:var(--danger); border:1.5px solid var(--surface);}
  .timetable-wrap{overflow-x:auto;}
  table.timetable{min-width:640px;}
  table.timetable th{text-align:left; padding:8px 10px; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); border-bottom:1px solid var(--border);}
  table.timetable td{padding:9px 10px; font-size:0.82rem; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  table.timetable tr.timetable-break td{background:var(--surface-2); font-weight:700; font-size:0.74rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); text-align:center;}
  table.timetable td.timetable-cell-editable{position:relative; cursor:pointer; transition:background 0.12s;}
  table.timetable td.timetable-cell-editable:hover{background:var(--border-soft);}
  table.timetable td.timetable-cell-editable .icon{position:absolute; top:6px; right:6px; opacity:0; color:var(--muted); transition:opacity 0.12s; width:14px; height:14px;}
  table.timetable td.timetable-cell-editable:hover .icon{opacity:1;}
  .stats-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:var(--sp-3); margin:var(--sp-4) 0;}
  .stat-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:16px 18px; display:flex; flex-direction:column; gap:2px; transition:transform 0.2s ease, box-shadow 0.2s ease; animation:fade-in-up 0.4s ease both;}
  .stat-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px var(--shadow);}
  .stat-value{font-family:var(--font-display); font-size:1.9rem; font-weight:700; line-height:1;}
  .stat-label{font-size:0.76rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:600;}

  /* ---- Header / breadcrumb ---- */
  .app-header{
    display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4);
    padding:var(--sp-4) var(--sp-6); border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  .crumbs{display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:0.88rem;}
  .crumb-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-weight:600;padding:2px 4px;border-radius:4px;}
  .crumb-btn:hover{color:var(--primary); background:var(--border-soft);}
  .crumb-btn.root{display:flex;align-items:center;gap:8px;color:var(--ink);}
  .crumb-sep{color:var(--muted);}
  .crumb-current{color:var(--muted); padding:2px 4px;}
  .brand-mark{
    width:28px;height:28px;border-radius:8px; background:var(--primary); color:var(--on-primary);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .save-indicator{display:flex; align-items:center; gap:7px; font-size:0.78rem; color:var(--muted); flex:none;}
  .save-dot{width:7px;height:7px;border-radius:50%; background:var(--muted);}
  .save-dot.saved{background:var(--good);}
  .save-dot.saving{background:var(--warn); animation:pulse 1s infinite ease-in-out;}
  .save-dot.error{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  @keyframes fade-in-up{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  @keyframes fade-in{from{opacity:0;} to{opacity:1;}}
  @keyframes pop-in{from{opacity:0; transform:scale(0.94) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);}}

  .content{padding:var(--sp-5) var(--sp-6) var(--sp-7); max-width:1100px; margin:0 auto;}
  .page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--sp-4); flex-wrap:wrap; margin-bottom:var(--sp-5);}
  .page-title{font-size:1.7rem;}
  .page-sub{color:var(--muted); font-size:0.9rem; margin-top:4px;}
  .page-actions{display:flex; gap:var(--sp-3); flex-wrap:wrap;}

  /* ---- Buttons ---- */
  .btn{display:inline-flex; align-items:center; gap:7px; justify-content:center; padding:9px 15px; border-radius:var(--radius-sm); border:1px solid transparent; font-weight:600; font-size:0.875rem; cursor:pointer; white-space:nowrap; transition:background .12s ease, border-color .12s ease, opacity .12s ease, transform .1s ease;}
  .btn:active{transform:scale(0.96);}
  .btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .btn-primary{background:var(--primary); color:var(--on-primary);}
  .btn-primary:hover{opacity:0.92;}
  .btn-ghost{background:transparent; border-color:var(--border); color:var(--ink-soft);}
  .btn-ghost:hover{background:var(--border-soft);}
  .btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-sm{padding:6px 10px; font-size:0.8rem;}
  .icon-btn{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); cursor:pointer; flex:none; transition:background 0.15s ease, color 0.15s ease, transform 0.1s ease;}
  .icon-btn:active{transform:scale(0.9);}
  .icon-btn:hover{background:var(--border-soft); color:var(--ink);}
  .icon-btn.danger:hover{background:var(--danger-soft); color:var(--danger); border-color:var(--danger);}

  /* ---- Cards / grids ---- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--sp-5); box-shadow:0 1px 2px var(--shadow);}
  .grid{display:grid; gap:var(--sp-4);}
  .classroom-grid{grid-template-columns:repeat(auto-fill, minmax(250px,1fr));}
  .classroom-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; cursor:pointer; text-align:left; width:100%; transition:transform 0.2s ease, box-shadow 0.2s ease; animation:fade-in-up 0.4s ease both;}
  .classroom-card:hover{box-shadow:0 12px 28px var(--shadow-lg); transform:translateY(-4px);}
  .classroom-card:active{transform:translateY(-1px);}
  .classroom-bar{height:7px;}
  .classroom-card-body{padding:var(--sp-5);}
  .classroom-grade{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:700;}
  .classroom-name{font-size:1.25rem; margin-top:2px;}
  .classroom-adviser{color:var(--ink-soft); font-size:0.85rem; margin-top:8px; display:flex; align-items:center; gap:6px;}
  .classroom-stats{display:flex; gap:var(--sp-4); margin-top:var(--sp-4); font-size:0.78rem; color:var(--muted);}
  .classroom-stats b{color:var(--ink); font-family:var(--font-mono); font-weight:600;}

  .section-heading{display:flex; align-items:baseline; justify-content:space-between; margin:var(--sp-6) 0 var(--sp-3);}
  .section-heading h2{font-size:1.05rem;}
  .link-btn{background:none;border:none;color:var(--primary);font-weight:600;font-size:0.85rem;cursor:pointer;padding:0;}

  .empty{border:1.5px dashed var(--border); border-radius:var(--radius-lg); padding:var(--sp-7) var(--sp-5); text-align:center; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:var(--sp-3); background:var(--surface);}
  .empty .icon{width:26px;height:26px; color:var(--muted);}
  .empty-title{color:var(--ink); font-weight:600; font-family:var(--font-display); font-size:1.05rem;}

  /* ---- Subtabs ---- */
  .subtabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:var(--sp-4); border-bottom:1px solid var(--border); padding-bottom:var(--sp-3);}
  .subtab{padding:8px 14px; border-radius:99px; border:1px solid transparent; background:transparent; cursor:pointer; font-size:0.86rem; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:7px; transition:background 0.15s ease, color 0.15s ease;}
  .subtab:hover{background:var(--border-soft); color:var(--ink);}
  .subtab.active{background:var(--primary-soft); color:var(--primary); border-color:var(--primary-soft);}

  /* ---- Tables ---- */
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--surface);}
  table{border-collapse:collapse; width:100%; font-size:0.875rem;}
  thead th{text-align:left; padding:11px 14px; background:var(--surface-2); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:600; border-bottom:1px solid var(--border); white-space:nowrap;}
  tbody td{padding:10px 14px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:var(--warn-soft);}
  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  .chip{display:inline-flex; align-items:center; padding:3px 9px; border-radius:99px; font-size:0.72rem; font-weight:600;}
  .chip-row{display:flex; gap:5px; flex-wrap:wrap;}
  .chip-green{background:var(--tag-green-bg); color:var(--tag-green-fg);}
  .chip-blue{background:var(--tag-blue-bg); color:var(--tag-blue-fg);}
  .chip-plum{background:var(--tag-plum-grad); color:var(--tag-plum-fg);}
  .chip-mustard{background:var(--tag-mustard-grad); color:var(--tag-mustard-fg);}
  .chip-rust{background:var(--tag-rust-grad); color:var(--tag-rust-fg);}
  .chip-teal{background:var(--tag-teal-grad); color:var(--tag-teal-fg);}
  .chip-slate{background:var(--tag-slate-bg); color:var(--tag-slate-fg);}
  .dot-green{background:#2E8A5B;} .dot-blue{background:#2E6FB0;} .dot-plum{background:linear-gradient(135deg,#74B3F0,#2E75C9);}
  .dot-mustard{background:linear-gradient(135deg,#FFE066,#F2B705);} .dot-rust{background:linear-gradient(135deg,#7ED99A,#3FA65C);} .dot-teal{background:linear-gradient(135deg,#FF9EC4,#E84393);} .dot-slate{background:#556274;}

  .badge{padding:3px 8px; border-radius:99px; font-size:0.72rem; font-weight:700; font-family:var(--font-mono);}
  .badge-good{background:var(--good-soft); color:var(--good);}
  .badge-warn{background:var(--warn-soft); color:var(--warn);}
  .badge-bad{background:var(--danger-soft); color:var(--danger);}
  .badge-slate{background:var(--tag-slate-bg); color:var(--tag-slate-fg);}

  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn.locked{background:var(--warn-soft); color:var(--warn); border-color:var(--warn-soft);}
  .icon-btn.locked:hover{background:var(--warn-soft); color:var(--warn);}
  .lock-chip{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:99px; font-size:0.68rem; font-weight:700; background:var(--warn-soft); color:var(--warn); margin-left:8px; vertical-align:middle;}
  tr.student-locked{background:var(--border-soft);}
  tr.student-locked:hover{background:var(--border-soft);}
  .locked-container{border:1.5px solid var(--warn-soft); background:var(--warn-soft); border-radius:var(--radius-md); padding:8px 14px; display:flex; align-items:center; gap:8px; color:var(--warn); font-size:0.82rem; font-weight:600;}

  .select, .input, .textarea{border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); padding:8px 11px; color:var(--ink); width:100%;}
  .select:focus-visible,.input:focus-visible,.textarea:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}
  .search-input{max-width:240px;}
  .toolbar{display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap; margin-bottom:var(--sp-4);}

  /* ---- subject cards ---- */
  .subject-grid{grid-template-columns:repeat(auto-fill, minmax(230px,1fr));}

  function playMessageTone(){
    try{
      var ctx = new (window.AudioContext||window.webkitAudioContext)();
      var now = ctx.currentTime;
      function tone(freq, start, dur, peak){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now+start);
        gain.gain.exponentialRampToValueAtTime(peak, now+start+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now+start+dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now+start); osc.stop(now+start+dur+0.03);
      }
      tone(1318.51, 0, 0.17, 0.20);
      tone(1567.98, 0.13, 0.28, 0.18);
      setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 700);
    }catch(e){}
  }

  function readAndCompressImage(file, maxDim, quality, cb){
    if(!file || !/^image\//.test(file.type)){ cb(null); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim/Math.max(w,h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        cb(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  function handleAttachmentFileChange(inputEl){

    uploadFileIfConfigured(file, storagePath).then(function(url){
      if(url){
        pendingAttachment.data = { name: file.name, type: file.type||'application/octet-stream', size: file.size, dataUrl: url };
        pendingAttachment.removed = false;
        if(prev) prev.textContent = file.name+' ('+humanFileSize(file.size)+')';
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e){
        pendingAttachment.data = { name: file.name, type: file.type||'application/octet-stream', size: file.size, dataUrl: e.target.result };
        pendingAttachment.removed = false;
        if(prev) prev.textContent = file.name+' ('+humanFileSize(file.size)+')';
      };
      reader.onerror = function(){ showToast('Could not read that file.', 'err'); };
      reader.readAsDataURL(file);
    });
  }

    d = d || {};

      {id:'c7', gradeLevel:'Grade 7', section:'Anthurium', color:'rust', adviser:'Ms. Sherlyn B. Mahusay'},
      {id:'c8', gradeLevel:'Grade 8', section:'Marigold', color:'mustard', adviser:'Mrs. Darine P. Trinidad'},
      {id:'c9', gradeLevel:'Grade 9', section:'Jasmine', color:'teal', adviser:'Ms. Ethel C. Sayson'},
      {id:'c10', gradeLevel:'Grade 10', section:'Aster', color:'plum', adviser:'Mrs. Gladyss C. Magno'}
    ];
    var subjects = Array.isArray(d.subjects)? d.subjects: [];
    var teacherAccounts;
    if(Array.isArray(d.teacherAccounts) && d.teacherAccounts.length){
      teacherAccounts = d.teacherAccounts;
    }else{
      teacherAccounts = [];
      classrooms.forEach(function(c){ if(c.adviser) teacherAccounts.push({id:'acc_'+c.id, name:c.adviser, pin:'1234', classroomId:c.id, subjectId:null, isAdmin:false}); });
      subjects.filter(function(s){return s.classroomId==='faculty';}).forEach(function(s){ teacherAccounts.push({id:'acc_'+s.id, name:s.name, pin:'1234', classroomId:null, subjectId:s.id, isAdmin:false}); });
    }
    teacherAccounts.forEach(function(a){ if(typeof a.isAdmin!=='boolean') a.isAdmin=false; });
    if(!teacherAccounts.some(function(a){return a.isAdmin;})){
      var defaultAdmin = teacherAccounts.find(function(a){return a.classroomId==='c8';}) || teacherAccounts[0];
      if(defaultAdmin) defaultAdmin.isAdmin = true;
    }
    return {
      department: (d.department && d.department.name) ? d.department : {name:'Dalid JHS Department'},
      teacherAccounts: teacherAccounts,
      classrooms: classrooms,
      subjects: subjects,
      students: Array.isArray(d.students)? d.students: [],
      lessonPlans: Array.isArray(d.lessonPlans)? d.lessonPlans: [],
      materials: Array.isArray(d.materials)? d.materials: [],
      events: Array.isArray(d.events)? d.events: [],

    };

  function termAvg(g){
    if(!g) return null;
    var vals = TERMS.map(function(t){return g[t];}).filter(function(v){return v!==undefined && v!==null && v!=='';});
    if(vals.length===0) return null;
    var sum = vals.reduce(function(a,b){return a+Number(b);},0);
    return sum/vals.length;
  }
  function generalAverage(student, classroomId){
    var subs = subjectsInClassroom(classroomId);
    var finals = subs.map(function(sub){ return termAvg((student.grades||{})[sub.id]); }).filter(function(v){return v!==null;});
    if(finals.length===0) return null;
    return finals.reduce(function(a,b){return a+b;},0)/finals.length;
  }
  function gradeDraftKey(subjectId, term){ return subjectId+'|'+term; }
  function effectiveGradesForSubject(student, subjectId){
    var g = (student.grades||{})[subjectId]||{};
    var eff = {};
    TERMS.forEach(function(t){
      var key = gradeDraftKey(subjectId, t);
      eff[t] = Object.prototype.hasOwnProperty.call(gradeDraft, key) ? gradeDraft[key] : g[t];
    });
    return eff;
  }
  function generalAverageWithDraft(student){
    var subs = subjectsInClassroom(student.classroomId);
    var finals = subs.map(function(sub){ return termAvg(effectiveGradesForSubject(student, sub.id)); }).filter(function(v){return v!==null;});
    if(finals.length===0) return null;
    return finals.reduce(function(a,b){return a+b;},0)/finals.length;
  }
  function gradeBadgeClass(pct){
    if(pct===null) return '';
    if(pct>=90) return 'badge-good';
    if(pct>=75) return 'badge-warn';
    return 'badge-bad';
  }
  function attendanceStats(student){
    var log = student.attendance||[];
    var counts = {Present:0,Late:0,Absent:0,Excused:0};
    log.forEach(function(r){ if(counts[r.status]!==undefined) counts[r.status]++; });
    var denom = counts.Present+counts.Late+counts.Absent;
    var rate = denom>0 ? (counts.Present+counts.Late)/denom*100 : null;
    return {counts:counts, rate:rate, total:log.length};
  }

  function nextDTRSlot(rec){
    if(!rec) return 'amIn';

    var slot = nextDTRSlot(rec);
    if(!slot) return null;
    rec[slot] = nowTimeStr();
    return slot;
  }

    return d.toLocaleDateString(undefined, {month:'long', year:'numeric'});
  }

  function buildMonthGrid(monthStr){
    var parts = monthStr.split('-');
    var y = Number(parts[0]), m = Number(parts[1])-1;
    var firstDow = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m+1, 0).getDate();
    var cells = [];
    for(var i=0;i<firstDow;i++) cells.push(null);
    for(var d=1; d<=daysInMonth; d++){ cells.push(y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')); }
    while(cells.length % 7 !== 0) cells.push(null);
    var weeks = [];
    for(var i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
    return weeks;
  }

  function animateStatCounters(){
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var els = document.querySelectorAll('.stat-value[data-count]');
    els.forEach(function(el){
      var target = Number(el.dataset.count) || 0;
      if(reduced || target===0){ el.textContent = target; return; }
      var duration = 650;
      var startTime = null;
      function tick(ts){
        if(!startTime) startTime = ts;
        var progress = Math.min((ts-startTime)/duration, 1);
        var eased = 1-Math.pow(1-progress, 3);
        el.textContent = Math.round(target*eased);
        if(progress<1) requestAnimationFrame(tick);
        else el.textContent = target;
      }
      requestAnimationFrame(tick);
    });
  }

    return '<span class="'+dotClass+'"></span><span>'+text+'</span>';
  }

  function subjectBOW(s, term){
    s.budgetOfWork = s.budgetOfWork || {t1:[], t2:[], t3:[]};
    s.budgetOfWork[term] = s.budgetOfWork[term] || [];
    return s.budgetOfWork[term];
  }
  function bowProgress(s, term){
    var items = subjectBOW(s, term);
    var done = items.filter(function(x){return x.done;}).length;
    return {done:done, total:items.length, pct: items.length? Math.round(done/items.length*100) : 0};
  }
  function myLinkedSubjects(teacherId){
    return state.subjects.filter(function(s){ return !isFaculty(s) && s.teacherAccountId===teacherId; })
      .sort(function(a,b){ return a.name.localeCompare(b.name); });
  }
  function canEditBOW(subject){
    if(!subject) return false;
    return subject.teacherAccountId===ui.currentTeacherId || isCurrentAdmin();
  }

            '<button type="button" class="icon-btn danger" data-action="delete-bow-topic" data-subject="'+s.id+'" data-term="'+t+'" data-id="'+item.id+'" aria-label="Delete">'+icon('trash','icon-sm')+'</button></div>'+

  function renderMyProfileScheduleTab(acc){
    var teacherRows = buildTeacherScheduleSummary();
    var t = teacherRows.find(function(x){ return x.key===acc.id; });
    var entries = t ? t.entries : [];
    var html = '<div class="section-heading"><h2>My Schedule</h2></div>'+
      '<p style="color:var(--muted);font-size:0.82rem;margin-top:-8px;margin-bottom:var(--sp-4);">Pulled live from the weekly timetable — update any section\'s schedule and this updates automatically.</p>';
    if(entries.length===0){
      html += emptyState('calendar','No periods scheduled yet','Once your name appears in a section\'s weekly timetable (Mon–Fri, in the format "Subject (Surname)"), your schedule will show up here automatically.', null, null);
      return html;
    }
    var totalMinutes = 0;
    var subjectsSet = {}, classroomsSet = {};
    var perDayCount = {Mon:0,Tue:0,Wed:0,Thu:0,Fri:0};
    entries.forEach(function(e){
      var start = TIMETABLE_ROW_START[e.rowIndex], end = TIMETABLE_ROW_END[e.rowIndex];
      if(start && end) totalMinutes += (timeStrToMinutes(end) - timeStrToMinutes(start));
      subjectsSet[canonicalSubjectName(e.subject)] = true;
      classroomsSet[e.classroomId] = true;
      perDayCount[e.day] = (perDayCount[e.day]||0)+1;
    });
    var totalHours = totalMinutes/60;
    var totalHoursStr = (Math.round(totalHours*10)/10).toString();
    html += '<div class="stats-row">'+
      '<div class="stat-card" style="animation-delay:0.02s;"><div class="stat-value" data-count="'+entries.length+'">0</div><div class="stat-label">Periods / Week</div></div>'+
      '<div class="stat-card" style="animation-delay:0.07s;"><div class="stat-value">'+totalHoursStr+'</div><div class="stat-label">Teaching Hours / Week</div></div>'+
      '<div class="stat-card" style="animation-delay:0.12s;"><div class="stat-value" data-count="'+Object.keys(subjectsSet).length+'">0</div><div class="stat-label">Subjects Taught</div></div>'+
      '<div class="stat-card" style="animation-delay:0.17s;"><div class="stat-value" data-count="'+Object.keys(classroomsSet).length+'">0</div><div class="stat-label">Sections Taught</div></div>'+
    '</div>';

    var maxCount = Math.max.apply(null, DAYS.map(function(d){return perDayCount[d]||0;}).concat([1]));
    html += '<div class="cal-card" style="margin-top:var(--sp-4);">'+
      '<div class="cal-month-label" style="font-size:0.95rem;margin-bottom:14px;">Periods per Day</div>'+
      DAYS.map(function(d){
        var count = perDayCount[d]||0;
        var pct = (count/maxCount*100);
        return '<div class="bar-row"><div class="bar-label">'+DAY_FULL[d]+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:var(--primary);"></div></div><div class="bar-count">'+count+'</div></div>';
      }).join('')+
    '</div>';

    var rowsTemplate = defaultTimetableRows();
    var cellMap = {};
    entries.forEach(function(e){ cellMap[e.rowIndex+'|'+e.day] = e; });
    var bodyRows = rowsTemplate.map(function(r, rowIndex){
      if(r.break){
        return '<tr class="fs-break-row"><td class="fs-time">'+escapeHtml(r.time)+'</td><td colspan="5">'+escapeHtml(r.break)+'</td></tr>';
      }
      var cells = TIMETABLE_DAYS.map(function(d){
        var e = cellMap[rowIndex+'|'+d];
        if(!e) return '<td class="fs-cell"></td>';
        var c = classroomById(e.classroomId);
        var colorClass = 'fs-block-'+(c?c.color:'slate');
        return '<td class="fs-cell"><div class="fs-block '+colorClass+'"><span class="fs-subject">'+escapeHtml(e.subject)+'</span>'+
          (c?'<span class="fs-section">'+escapeHtml(c.gradeLevel)+' - '+escapeHtml(c.section)+'</span>':'')+'</div></td>';
      }).join('');
      return '<tr><td class="fs-time">'+escapeHtml(r.time)+'</td>'+cells+'</tr>';
    }).join('');
    html += '<div class="section-heading" style="margin-top:var(--sp-5);"><h2>Weekly Grid</h2></div>'+
      '<div class="table-wrap"><table class="fs-grid"><thead><tr><th></th>'+TIMETABLE_DAYS.map(function(d){return '<th>'+d+'</th>';}).join('')+'</tr></thead>'+
      '<tbody>'+bodyRows+'</tbody></table></div>';
    return html;
  }

  function studentRowsTable(list, classroomId, genderKey){

  function renderScheduleAgenda(items, emptyAction, emptyActionLabel){
    var byDay = {}; DAYS.forEach(function(d){ byDay[d] = []; });
    var any = false;
    items.forEach(function(s){
      var liveEntries = subjectTimetableEntries(s);
      if(liveEntries.length){
        liveEntries.forEach(function(e){ if(byDay[e.day]){ byDay[e.day].push({subject:s, start:e.start, end:e.end}); any = true; } });
      }else if(s.schedule && s.schedule.days && s.schedule.days.length){
        s.schedule.days.forEach(function(d){ if(byDay[d]){ byDay[d].push({subject:s, start:s.schedule.start, end:s.schedule.end}); any = true; } });
      }
    });
    if(!any) return emptyState('calendar','No schedule yet','Add time slots to build the weekly schedule.', emptyAction, emptyActionLabel);
    var cols = DAYS.map(function(d){
      var dayItems = byDay[d].slice().sort(function(a,b){ return (a.start||'').localeCompare(b.start||''); });
      var body = dayItems.length? dayItems.map(function(item){
        var s = item.subject;
        return '<div class="agenda-item" data-action="go-subject" data-id="'+s.id+'" style="cursor:pointer;"><div class="agenda-time">'+fmtTime(item.start)+'–'+fmtTime(item.end)+'</div>'+
          '<div class="agenda-name">'+escapeHtml(s.name)+'</div>'+(s.teacher?'<div class="agenda-teacher">'+escapeHtml(s.teacher)+'</div>':'')+'</div>';
      }).join('') : '<div style="color:var(--muted);font-size:0.78rem;padding:6px 2px;">No classes</div>';
      return '<div class="day-col"><div class="day-head">'+DAY_FULL[d]+'</div><div class="day-body">'+body+'</div></div>';
    }).join('');
    return '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));">'+cols+'</div>';
  }
  var TIMETABLE_DAYS = ['Mon','Tue','Wed','Thu','Fri'];
  function defaultTimetableRows(){
    var blank = function(){ return {Mon:'',Tue:'',Wed:'',Thu:'',Fri:''}; };
    return [
      {time:'8:00-9:00 AM', cells:blank()},
      {time:'9:00-10:00 AM', cells:blank()},
      {time:'10:00-10:20 AM', break:'Health Break'},
      {time:'10:20-11:20 AM', cells:blank()},
      {time:'11:20-12:20 PM', cells:blank()},
      {time:'12:20-1:00 PM', break:'Lunch Break'},
      {time:'1:00-2:00 PM', cells:blank()},
      {time:'2:00-3:00 PM', cells:blank()},
      {time:'3:00-4:00 PM', cells:blank()},
      {time:'4:00-5:00 PM', cells:blank()}

  }
  function ensureTimetable(classroomId){
    if(state.weeklySchedules[classroomId] && state.weeklySchedules[classroomId].length) return;
    state.weeklySchedules[classroomId] = defaultTimetableRows();
  }
  function updateTimetableCell(classroomId, rowIndex, day, value){
    var rows = state.weeklySchedules[classroomId];
    if(!rows || !rows[rowIndex] || rows[rowIndex].break) return;
    rows[rowIndex].cells = rows[rowIndex].cells || {};
    rows[rowIndex].cells[day] = value;
  }
  function renderWeeklyTimetable(classroomId){
    var rows = (state.weeklySchedules||{})[classroomId];
    var canEdit = canEditClassroom(classroomId);
    if(!rows || !rows.length){
      if(!canEdit) return '';
      return '<div class="section-heading"><h2>Weekly Timetable</h2></div>'+
        '<div class="empty">'+icon('calendar')+'<div class="empty-title">No timetable set up yet</div>'+
        '<p>Create a weekly bell schedule you can edit period by period.</p>'+
        '<button class="btn btn-primary btn-sm" data-action="setup-timetable" data-id="'+classroomId+'">'+icon('plus')+'Set Up Timetable</button></div>';
    }

    var body = rows.map(function(r, rowIndex){
      if(r.break){
        return '<tr class="timetable-break"><td>'+escapeHtml(r.time)+'</td><td colspan="5">'+escapeHtml(r.break)+'</td></tr>';
      }
      var cells = TIMETABLE_DAYS.map(function(d){
        var v = (r.cells&&r.cells[d])||'';
        var content = v?escapeHtml(v):'<span style="color:var(--muted)">—</span>';
        if(canEdit){
          return '<td class="timetable-cell-editable" data-action="edit-timetable-cell" data-id="'+classroomId+'" data-row="'+rowIndex+'" data-day="'+d+'">'+content+icon('pencil','icon-sm')+'</td>';
        }
        return '<td>'+content+'</td>';
      }).join('');
      return '<tr><td class="num">'+escapeHtml(r.time)+'</td>'+cells+'</tr>';
    }).join('');
    return '<div class="section-heading"><h2>Weekly Timetable</h2>'+

      '<div class="table-wrap timetable-wrap"><table class="timetable"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
  }
  function resolveTeacherAccountBySurname(surname){
    return state.teacherAccounts.find(function(a){
      if(lastNameOf(a.name).toLowerCase()===surname.toLowerCase()) return true;
      return Array.isArray(a.aliases) && a.aliases.some(function(al){ return al.toLowerCase()===surname.toLowerCase(); });
    });
  }
  var SUBJECT_NAME_ALIASES = {
    'tle':'technology and livelihood education',
    'epp/tle':'technology and livelihood education',
    'epp':'technology and livelihood education',
    'values education':'edukasyon sa pagpapakatao',
    'esp':'edukasyon sa pagpapakatao',
    'ap':'araling panlipunan',
    'math':'mathematics',
    'fil':'filipino',
    'sci':'science',
    'eng':'english'
  };
  function canonicalSubjectName(name){
    var n = (name||'').trim().toLowerCase();
    return SUBJECT_NAME_ALIASES[n] || n;
  }
  function syncSubjectTeacherFromCellText(classroomId, cellText, opts){
    if(!cellText) return false;
    var m = cellText.match(/^(.*?)\s*\(([^)]+)\)$/);
    if(!m) return false;
    var subjName = m[1].trim();
    var surname = m[2].trim();
    var acc = resolveTeacherAccountBySurname(surname);
    if(!acc) return false;
    var subjCanonical = canonicalSubjectName(subjName);
    var subj = state.subjects.find(function(s){ return s.classroomId===classroomId && !isFaculty(s) && canonicalSubjectName(s.name)===subjCanonical; });
    if(!subj) return false;
    if(subj.teacherAccountId===acc.id) return false;
    subj.teacher = acc.name;
    subj.teacherAccountId = acc.id;
    if(opts && opts.log) logActivity('Linked '+acc.name+' as teacher for '+subj.name+' based on the weekly timetable.');
    return true;
  }
  function syncAllSubjectTeachersFromTimetable(){
    var changed = false;
    state.classrooms.forEach(function(c){
      var rows = (state.weeklySchedules||{})[c.id];
      if(!rows) return;
      rows.forEach(function(r){
        if(r.break) return;
        TIMETABLE_DAYS.forEach(function(d){
          var cell = (r.cells&&r.cells[d])||'';
          if(syncSubjectTeacherFromCellText(c.id, cell, {log:false})) changed = true;
        });
      });
    });
    return changed;
  }
  function subjectTimetableEntries(subject){
    if(!subject || isFaculty(subject)) return [];
    var rows = (state.weeklySchedules||{})[subject.classroomId];
    if(!rows) return [];
    var canonical = canonicalSubjectName(subject.name);
    var entries = [];
    rows.forEach(function(r, rowIndex){
      if(r.break) return;
      TIMETABLE_DAYS.forEach(function(d){
        var cell = (r.cells&&r.cells[d])||'';
        var m = cell.match(/^(.*?)\s*\(([^)]+)\)$/);
        if(m && canonicalSubjectName(m[1].trim())===canonical){
          entries.push({day:d, start:TIMETABLE_ROW_START[rowIndex], end:TIMETABLE_ROW_END[rowIndex]});
        }
      });
    });
    return entries;
  }
  function subjectScheduleChipHtml(subject){
    var entries = subjectTimetableEntries(subject);
    if(entries.length){
      var sameTime = entries.every(function(e){ return e.start===entries[0].start && e.end===entries[0].end; });
      var dayList = entries.map(function(e){return e.day;}).join(' ');
      if(sameTime){
        return '<span class="chip chip-slate">'+dayList+' · '+fmtTime(entries[0].start)+'–'+fmtTime(entries[0].end)+'</span>';
      }
      return '<span class="chip chip-slate">'+entries.map(function(e){ return e.day+' '+fmtTime(e.start)+'–'+fmtTime(e.end); }).join(', ')+'</span>';
    }
    var days = (subject.schedule&&subject.schedule.days)||[];
    if(days.length){
      var timeStr = subject.schedule.start ? fmtTime(subject.schedule.start)+'–'+fmtTime(subject.schedule.end) : '';
      return '<span class="chip chip-slate">'+days.join(' ')+(timeStr?' · '+timeStr:'')+'</span>';
    }
    return '<span class="chip chip-slate">No schedule set</span>';
  }
  function subjectScheduleSummaryText(subject){
    var entries = subjectTimetableEntries(subject);
    if(entries.length){
      var sameTime = entries.every(function(e){ return e.start===entries[0].start && e.end===entries[0].end; });
      var dayList = entries.map(function(e){return e.day;}).join(' ');
      if(sameTime) return dayList+' '+fmtTime(entries[0].start)+'–'+fmtTime(entries[0].end);
      return entries.map(function(e){ return e.day+' '+fmtTime(e.start)+'–'+fmtTime(e.end); }).join(', ');
    }
    var days = (subject.schedule&&subject.schedule.days)||[];
    if(days.length){
      var timeStr = subject.schedule.start ? fmtTime(subject.schedule.start)+'–'+fmtTime(subject.schedule.end) : '';
      return days.join(' ')+(timeStr?' '+timeStr:'');
    }
    return '';
  }
  function buildTeacherScheduleSummary(){
    var map = {};
    function ensureEntry(surname){
      var acc = resolveTeacherAccountBySurname(surname);
      var key = acc ? acc.id : surname.toLowerCase();
      if(!map[key]) map[key] = {key:key, displayName: acc ? acc.name : surname, entries: []};
      return map[key];
    }
    state.classrooms.forEach(function(c){
      var rows = (state.weeklySchedules||{})[c.id];
      if(!rows) return;
      rows.forEach(function(r, rowIndex){
        if(r.break) return;
        TIMETABLE_DAYS.forEach(function(d){
          var cell = (r.cells&&r.cells[d])||'';
          if(!cell) return;
          var m = cell.match(/^(.*?)\s*\(([^)]+)\)$/);
          if(m){
            ensureEntry(m[2].trim()).entries.push({classroomId:c.id, rowIndex:rowIndex, day:d, time:r.time, subject:m[1].trim()});
          }else if(/^Homeroom/i.test(cell) && c.adviser){
            ensureEntry(lastNameOf(c.adviser)).entries.push({classroomId:c.id, rowIndex:rowIndex, day:d, time:r.time, subject:cell});
          }
        });
      });
    });
    var list = Object.keys(map).map(function(k){ return map[k]; });
    list.sort(function(a,b){ return a.displayName.localeCompare(b.displayName); });
    return list;
  }
  function renderFacultyScheduleGrid(){
    var teacherRows = buildTeacherScheduleSummary();
    if(!teacherRows.length){
      return emptyState('calendar','No teaching schedule yet','Set up each section\'s weekly timetable — every teacher\'s combined schedule will appear here automatically.', null, null);
    }
    var rowsTemplate = defaultTimetableRows();
    var canEdit = !!ui.currentTeacherId;
    var cards = teacherRows.map(function(t){
      var cellMap = {};
      t.entries.forEach(function(e){ cellMap[e.rowIndex+'|'+e.day] = e; });
      var bodyRows = rowsTemplate.map(function(r, rowIndex){
        if(r.break){
          return '<tr class="fs-break-row"><td class="fs-time">'+escapeHtml(r.time)+'</td><td colspan="5">'+escapeHtml(r.break)+'</td></tr>';
        }
        var cells = TIMETABLE_DAYS.map(function(d){
          var e = cellMap[rowIndex+'|'+d];
          if(!e) return '<td class="fs-cell"></td>';
          var c = classroomById(e.classroomId);
          var colorClass = 'fs-block-'+(c?c.color:'slate');
          var clickAttrs = canEdit ? ' data-action="edit-teacher-schedule-cell" data-classroom="'+e.classroomId+'" data-row="'+e.rowIndex+'" data-day="'+d+'"' : '';
          return '<td class="fs-cell'+(canEdit?' fs-cell-editable':'')+'"'+clickAttrs+'>'+
            '<div class="fs-block '+colorClass+'"><span class="fs-subject">'+escapeHtml(e.subject)+'</span>'+
            (c?'<span class="fs-section">'+escapeHtml(c.gradeLevel)+' - '+escapeHtml(c.section)+'</span>':'')+'</div>'+
          '</td>';
        }).join('');
        return '<tr><td class="fs-time">'+escapeHtml(r.time)+'</td>'+cells+'</tr>';
      }).join('');
      var fsAcc = teacherAccountById(t.key);
      var fsAvatarSrc = fsAcc || {id:t.key, name:t.displayName};
      var open = !!expandedTeacherSchedules[t.key];
      return '<div class="fs-card">'+
        '<div class="fs-card-accent" style="background:'+teacherGradient(fsAvatarSrc.id)+';"></div>'+
        '<div class="fs-card-head fs-card-head-clickable" data-action="toggle-teacher-schedule" data-id="'+escapeAttr(t.key)+'">'+teacherAvatarHtml(fsAvatarSrc, 26)+'<span class="fs-name">'+escapeHtml(t.displayName)+'</span>'+
          '<span class="fs-count">'+t.entries.length+' period'+(t.entries.length===1?'':'s')+'</span>'+
          '<span class="fs-chevron" style="transform:'+(open?'rotate(180deg)':'none')+';">'+icon('chevronDown','icon-sm')+'</span></div>'+
        (open? '<div class="table-wrap fs-wrap"><table class="fs-grid"><thead><tr><th></th>'+TIMETABLE_DAYS.map(function(d){return '<th>'+d+'</th>';}).join('')+'</tr></thead>'+
        '<tbody>'+bodyRows+'</tbody></table></div>' : '')+
      '</div>';
    }).join('');
    return '<p style="color:var(--muted);font-size:0.82rem;margin-bottom:var(--sp-4);">Click a teacher to view their schedule'+(canEdit?' — click any period inside to edit it. Everyone signed in can update this board.':'.')+'</p>'+
      '<div class="fs-board">'+cards+'</div>';
  }

      '</div>'+

    html += '<div class="subtabs">'+

  function renderStudentGradesTab(s, c, canEdit){
    if(gradeDraftStudentId !== s.id){ gradeDraft = {}; gradeDraftStudentId = s.id; }
    var subs = c ? subjectsInClassroom(c.id) : [];
    var dirty = Object.keys(gradeDraft).length>0;
    var html = '<div class="section-heading"><h2>Grades</h2><div class="grade-toolbar" id="grade-toolbar">'+
        '<button type="button" class="btn btn-ghost btn-sm grade-draft-btn" id="grade-discard-btn" data-action="discard-grades" style="display:'+(dirty?'inline-flex':'none')+';">'+icon('x','icon-sm')+'Discard</button>'+
        '<button type="button" class="btn btn-primary btn-sm grade-draft-btn" id="grade-save-btn" data-action="save-grades" style="display:'+(dirty?'inline-flex':'none')+';">'+icon('check','icon-sm')+'Save Grades</button>'+
        '<button type="button" class="btn btn-ghost btn-sm" data-action="print-report-card">'+icon('printer','icon-sm')+'Print Report Card</button>'+
      '</div></div>'+
      '<p class="grade-unsaved-note" id="grade-unsaved-note" style="display:'+(dirty?'flex':'none')+';">'+icon('flag','icon-sm')+'You have unsaved grade changes — click "Save Grades" to apply them.</p>';
    if(subs.length===0){
      html += emptyState('book','No subjects yet','Add subjects to this classroom to record grades.', null, null);
      return html;
    }
    var headCells = TERMS.map(function(t){return '<th>'+TERM_LABELS[t]+'</th>';}).join('');
    var rows = subs.map(function(sub){
      var g = (s.grades||{})[sub.id]||{};
      var canEditThisSubject = canEditSubject(sub);
      var cells = TERMS.map(function(t){
        var key = gradeDraftKey(sub.id, t);
        var isDirty = Object.prototype.hasOwnProperty.call(gradeDraft, key);
        var val = isDirty ? gradeDraft[key] : (g[t]!==undefined?g[t]:'');
        return canEditThisSubject?
          '<td><input type="number" class="input grade-input'+(isDirty?' grade-input-dirty':'')+'" min="0" max="100" value="'+escapeAttr(val)+'" placeholder="—" data-action="set-grade" data-subject="'+sub.id+'" data-term="'+t+'"></td>'
          : '<td>'+(g[t]!==undefined?g[t]:'<span style="color:var(--muted)">—</span>')+'</td>';
      }).join('');
      var avg = termAvg(effectiveGradesForSubject(s, sub.id));
      return '<tr><td><strong>'+escapeHtml(sub.name)+'</strong></td>'+cells+'<td id="favg-cell-'+sub.id+'">'+finalAvgHtml(avg)+'</td></tr>';
    }).join('');
    html += '<div class="table-wrap"><table><thead><tr><th>Subject</th>'+headCells+'<th>Final</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    var ga = generalAverageWithDraft(s);
    html += '<div class="info-card" style="margin-top:var(--sp-4);max-width:260px;"><div class="info-label">General average</div><div class="info-value" id="general-avg-value">'+(ga===null?'—':ga.toFixed(1))+'</div></div>';
    return html;
  }

  function fmtRelativeTime(iso){
    if(!iso) return '';
    var then = new Date(iso).getTime();
    if(isNaN(then)) return '';
    var diffSec = Math.floor((Date.now()-then)/1000);
    if(diffSec<5) return 'Just now';
    if(diffSec<60) return diffSec+'s';
    var diffMin = Math.floor(diffSec/60);
    if(diffMin<60) return diffMin+'m';
    var diffHr = Math.floor(diffMin/60);
    if(diffHr<24) return diffHr+'h';
    var diffDay = Math.floor(diffHr/24);
    if(diffDay<7) return diffDay+'d';
    return fmtDateShort(iso.slice(0,10));
  }
  function activityIconFor(text){
    if(/locked|unlocked/i.test(text)) return 'lock';
    if(/attendance/i.test(text)) return 'check';
    if(/guidance|offense|counseling|commendation/i.test(text)) return 'flag';
    if(/home visit/i.test(text)) return 'home';
    if(/activity/i.test(text)) return 'award';
    if(/photo/i.test(text)) return 'camera';
    if(/time record/i.test(text)) return 'clock';
    if(/lesson plan/i.test(text)) return 'calendar';
    if(/material/i.test(text)) return 'folder';
    if(/event/i.test(text)) return 'calendar';
    if(/student/i.test(text)) return 'users';
    if(/subject|teacher/i.test(text)) return 'book';
    return 'bell';
  }

  /* ---------------------------- form submit ---------------------------- */
  function handleFormSubmit(form){
    var fd = new FormData(form);
    var kind = form.dataset.form;
    var editId = form.dataset.editId;
    if(kind==='login'){
      var loginTeacherId = fd.get('teacherId');
      var enteredPin = (fd.get('pin')||'').trim();
      var acct = teacherAccountById(loginTeacherId);
      if(acct && enteredPin && enteredPin===acct.pin){
        ui.authed=true; ui.currentTeacherId=acct.id; ui.loginError=null; ui.tab='department'; persistUIState(); renderApp();
        checkForNewChatTone();
        checkScheduleAlerts();
      }else{
        ui.loginError='Incorrect PIN. Try again.'; renderApp();
      }
    }else if(kind==='chatmessage'){
      var chatText = (fd.get('text')||'').trim();
      if(!chatText || !ui.currentTeacherId) return;
      addMessage(ui.currentTeacherId, chatText);
      document.getElementById('modal-root').innerHTML = renderChatPanel();
      var chatListEl2 = document.getElementById('chat-list'); if(chatListEl2) chatListEl2.scrollTop = chatListEl2.scrollHeight;
      queueSave();
    }else if(kind==='addteacher'){
      if(!isCurrentAdmin()){ showToast('Only the admin can add teachers.', 'err'); closeModal(); return; }
      var newName = (fd.get('name')||'').trim();
      var newPin = (fd.get('pin')||'').trim();
      var newClassroomId = fd.get('classroomId') || null;
      if(!newName || !newPin) return;
      addTeacherAccount(newName, newPin, newClassroomId);
      logActivity('Added teacher account for '+newName+'.');
      openModal(modalManageTeachers()); showToast('Teacher added.'); queueSave();
    }else if(kind==='teacherpin'){
      var pinTeacherId = fd.get('teacherId');
      var updatedPin = (fd.get('pin')||'').trim();
      if(pinTeacherId!==ui.currentTeacherId){ showToast('You can only change your own PIN.', 'err'); closeModal(); return; }
      if(!updatedPin) return;
      updateTeacherAccountPin(pinTeacherId, updatedPin);
      openModal(modalManageTeachers()); showToast('PIN updated.'); queueSave();
    }else if(kind==='timetablecell'){
      var ttClassroomId = fd.get('classroomId');
      var ttFromBoard = fd.get('origin')==='facultyboard';
      if(ttFromBoard){ if(!ui.currentTeacherId){ closeModal(); return; } }
      else if(!canEditClassroom(ttClassroomId)){ showToast('You can\'t edit this.', 'err'); closeModal(); return; }
      var ttRowIndex = Number(fd.get('rowIndex'));
      var ttDay = fd.get('day');
      var ttValue = (fd.get('value')||'').trim();
      updateTimetableCell(ttClassroomId, ttRowIndex, ttDay, ttValue);
      var ttClassroom = classroomById(ttClassroomId);
      logActivity('Updated the '+(ttClassroom?ttClassroom.gradeLevel+' - '+ttClassroom.section:'')+' timetable ('+ttDay+').');
      syncSubjectTeacherFromCellText(ttClassroomId, ttValue, {log:true});
      closeModal(); renderApp(); queueSave();
    }else if(kind==='adviser'){
      var advClassroom = classroomById(fd.get('classroomId'));
      var advName = (fd.get('name')||'').trim();
      updateAdviser(fd.get('classroomId'), advName);
      if(advClassroom) logActivity('Set adviser of '+advClassroom.gradeLevel+' - '+advClassroom.section+' to '+advName+'.');
      closeModal(); renderApp(); queueSave();
    }else if(kind==='student'){
      var sdata = { classroomId: fd.get('classroomId'), name:(fd.get('name')||'').trim(), gender: fd.get('gender'), birthday: fd.get('birthday'), status: fd.get('status'), address:(fd.get('address')||'').trim() };
      if(!sdata.name) return;
      var sClassroom = classroomById(sdata.classroomId);
      var sPlace = sClassroom? sClassroom.gradeLevel+' - '+sClassroom.section : 'a section';
      if(editId){ updateStudent(editId, sdata); logActivity('Updated student '+sdata.name+' in '+sPlace+'.'); }
      else{ addStudent(sdata); logActivity('Added student '+sdata.name+' to '+sPlace+'.'); }
      closeModal(); renderApp(); queueSave();
    }else if(kind==='subject'){
      var days = fd.getAll('days');
      var subdata = { classroomId: fd.get('classroomId'), name:(fd.get('name')||'').trim(), teacher:(fd.get('teacher')||'').trim(), schedule:{days:days, start:fd.get('start')||'', end:fd.get('end')||''}, teacherAccountId: fd.get('teacherAccountId')||null };
      if(!subdata.name) return;
      var subIsFaculty = subdata.classroomId==='faculty';
      var subClassroom = classroomById(subdata.classroomId);
      var subPlace = subIsFaculty? 'Faculty Room' : (subClassroom? subClassroom.gradeLevel+' - '+subClassroom.section : 'a section');
      if(editId){ updateSubject(editId, subdata); logActivity('Updated '+(subIsFaculty?'teacher '+subdata.name:'subject '+subdata.name)+' in '+subPlace+'.'); }
      else{ addSubject(subdata); logActivity('Added '+(subIsFaculty?'teacher '+subdata.name:'subject '+subdata.name)+' to '+subPlace+'.'); }
      closeModal(); renderApp(); queueSave();
    }else if(kind==='lesson'){
      var ldata = { subjectId: fd.get('subjectId'), title:(fd.get('title')||'').trim(), date: fd.get('date'), objectives:(fd.get('objectives')||'').trim(), content:(fd.get('content')||'').trim() };
      if(!ldata.title) return;
      var lsub = subjectById(ldata.subjectId);
      var existingLesson = editId ? state.lessonPlans.find(function(p){return p.id===editId;}) : null;
      ldata.attachment = resolveAttachment(existingLesson?existingLesson.attachment:null, fd);
      if(editId){ updateLessonPlan(editId, ldata); logActivity('Updated lesson plan "'+ldata.title+'"'+(lsub?' for '+lsub.name:'')+'.'); }
      else{ addLessonPlan(ldata); logActivity('Added lesson plan "'+ldata.title+'"'+(lsub?' for '+lsub.name:'')+'.'); }
      closeModal(); renderApp(); queueSave();
    }else if(kind==='material'){
      var mdata = { subjectId: fd.get('subjectId'), title:(fd.get('title')||'').trim(), type: fd.get('type'), url:(fd.get('url')||'').trim(), notes:(fd.get('notes')||'').trim() };
      if(!mdata.title) return;
      var msub = subjectById(mdata.subjectId);
      var existingMaterial = editId ? state.materials.find(function(m){return m.id===editId;}) : null;
      mdata.attachment = resolveAttachment(existingMaterial?existingMaterial.attachment:null, fd);
      if(editId){ updateMaterial(editId, mdata); logActivity('Updated material "'+mdata.title+'"'+(msub?' for '+msub.name:'')+'.'); }
      else{ addMaterial(mdata); logActivity('Added material "'+mdata.title+'"'+(msub?' for '+msub.name:'')+'.'); }

  document.addEventListener('change', function(e){
    if(e.target.matches('[data-action="attachment-file-input"]')){
      handleAttachmentFileChange(e.target);
    }
    if(e.target.matches('[data-action="toggle-term-checklist"]')){
      if(!ui.currentTeacherId) return;
      var tclTerm = e.target.dataset.term, tclItem = e.target.dataset.item;
      toggleTermChecklistItem(ui.currentTeacherId, tclTerm, tclItem);
      var tclAcc = currentAccount();
      var tclLabel = (TERM_CHECKLIST_ITEMS.find(function(it){return it.key===tclItem;})||{}).label||tclItem;
      logActivity((getTermChecklist(tclAcc, tclTerm)[tclItem]?'Checked off "':'Unchecked "')+tclLabel+'" for '+TERM_LABELS[tclTerm]+'.');
      queueSave();
      renderApp();
    }
    if(e.target.matches('[data-action="toggle-bow-topic"]')){

      if(!canEditBOW(bowToggleSubj)) return;
      var bowToggleTerm = e.target.dataset.term, bowToggleId = e.target.dataset.id;
      toggleBOWTopic(bowToggleSubj.id, bowToggleTerm, bowToggleId);
      var bowToggleItem = subjectBOW(bowToggleSubj, bowToggleTerm).find(function(x){return x.id===bowToggleId;});

      queueSave();
      renderApp();
    }
    if(e.target.id==='att-date'){
      loadAttendanceForDate(ui.classroomId, e.target.value);
      var view = document.getElementById('view'); if(view) view.innerHTML = renderClassroomView();
    }
    if(e.target.id==='student-photo-input'){
      var photoFile = e.target.files && e.target.files[0];
      if(!photoFile) return;
      var photoStuId = ui.studentId;
      var photoStu = studentById(photoStuId);
      if(!photoStu || !canEditClassroom(photoStu.classroomId)) return;
      readAndCompressImage(photoFile, 420, 0.75, function(dataUri){
        if(!dataUri){ showToast('Could not read that image.', 'err'); return; }
        uploadImageIfConfigured(dataUri, 'photos/student-'+photoStuId+'.jpg').then(function(url){
          setStudentPhoto(photoStuId, url);
          logActivity('Updated photo for '+photoStu.name+'.');
          queueSave(); renderApp();
        });
      });
    }
    if(e.target.id==='chat-file-input'){
      var chatFile = e.target.files && e.target.files[0];
      if(!chatFile || !ui.currentTeacherId) return;
      if(chatFile.size > MAX_ATTACHMENT_BYTES){ showToast('File is too large — max 4 MB.', 'err'); e.target.value=''; return; }
      var chatSenderId = ui.currentTeacherId;
      var chatStoragePath = 'attachments/'+uid('chat')+'-'+chatFile.name;
      uploadFileIfConfigured(chatFile, chatStoragePath).then(function(url){
        if(url){
          addMessage(chatSenderId, '', {name:chatFile.name, type:chatFile.type||'application/octet-stream', size:chatFile.size, dataUrl:url});
          document.getElementById('modal-root').innerHTML = renderChatPanel();
          var chatListEl4 = document.getElementById('chat-list'); if(chatListEl4) chatListEl4.scrollTop = chatListEl4.scrollHeight;
          queueSave();
          return;
        }
        var reader = new FileReader();
        reader.onload = function(ev){
          addMessage(chatSenderId, '', {name:chatFile.name, type:chatFile.type||'application/octet-stream', size:chatFile.size, dataUrl:ev.target.result});
          document.getElementById('modal-root').innerHTML = renderChatPanel();
          var chatListEl3 = document.getElementById('chat-list'); if(chatListEl3) chatListEl3.scrollTop = chatListEl3.scrollHeight;
          queueSave();
        };
        reader.onerror = function(){ showToast('Could not read that file.', 'err'); };
        reader.readAsDataURL(chatFile);
      });
    }
    if(e.target.id==='teacher-photo-input'){
      var teacherPhotoFile = e.target.files && e.target.files[0];
      if(!teacherPhotoFile || !ui.currentTeacherId) return;
      var teacherForPhoto = currentAccount();
      readAndCompressImage(teacherPhotoFile, 420, 0.75, function(dataUri){
        if(!dataUri){ showToast('Could not read that image.', 'err'); return; }
        uploadImageIfConfigured(dataUri, 'photos/teacher-'+ui.currentTeacherId+'.jpg').then(function(url){
          setTeacherPhoto(ui.currentTeacherId, url);
          if(teacherForPhoto) logActivity('Updated photo for '+teacherForPhoto.name+'.');
          queueSave(); renderApp();
        });
      });
    }
    if(e.target.matches('[data-action="pick-subject-period"]')){
      var pIdx = e.target.value;
      if(pIdx!==''){
        var period = STANDARD_PERIODS[Number(pIdx)];
        var startEl = document.getElementById('f-sub-start'), endEl = document.getElementById('f-sub-end');
        if(startEl) startEl.value = period.start;
        if(endEl) endEl.value = period.end;
      }
    }
  });

  document.addEventListener('input', function(e){
    if(e.target.id==='student-search'){
      var wrap = document.getElementById('student-table-wrap');
      var c = classroomById(ui.classroomId);
      if(wrap && c) wrap.innerHTML = renderStudentTable(c, e.target.value);
    }
    if(e.target.id==='dept-student-search'){
      var dwrap = document.getElementById('dept-student-search-wrap');
      if(dwrap) dwrap.innerHTML = renderDeptStudentResults(e.target.value);
    }
    if(e.target.matches('[data-action="set-grade"]')){
      var gSubjId = e.target.dataset.subject, gTerm = e.target.dataset.term;
      if(!canEditSubject(subjectById(gSubjId))) return;
      var gSt = studentById(ui.studentId); if(!gSt) return;
      var gKey = gradeDraftKey(gSubjId, gTerm);
      var gVal = e.target.value;
      var gStoredVal = ((gSt.grades||{})[gSubjId]||{})[gTerm];
      var gStoredStr = gStoredVal!==undefined && gStoredVal!==null ? String(gStoredVal) : '';
      if(gVal===gStoredStr){ delete gradeDraft[gKey]; } else { gradeDraft[gKey] = gVal; }
      var gIsDirty = Object.prototype.hasOwnProperty.call(gradeDraft, gKey);
      e.target.classList.toggle('grade-input-dirty', gIsDirty);
      var gFavg = document.getElementById('favg-cell-'+gSubjId);
      if(gFavg) gFavg.innerHTML = finalAvgHtml(termAvg(effectiveGradesForSubject(gSt, gSubjId)));
      var gGaEl = document.getElementById('general-avg-value');
      if(gGaEl){ var gGa = generalAverageWithDraft(gSt); gGaEl.textContent = gGa===null?'—':gGa.toFixed(1); }
      var gDirtyNow = Object.keys(gradeDraft).length>0;
      var gSaveBtn = document.getElementById('grade-save-btn'); if(gSaveBtn) gSaveBtn.style.display = gDirtyNow?'inline-flex':'none';
      var gDiscardBtn = document.getElementById('grade-discard-btn'); if(gDiscardBtn) gDiscardBtn.style.display = gDirtyNow?'inline-flex':'none';
      var gNote = document.getElementById('grade-unsaved-note'); if(gNote) gNote.style.display = gDirtyNow?'flex':'none';
    }
  });

  document.addEventListener('click', function(e){
    if(e.target.matches('[data-backdrop]')){ closeModal(); return; }
    var t = e.target.closest('[data-action]');
    if(!t) return;
    if(t.dataset.stop) e.stopPropagation();
    var action = t.dataset.action;
    var id = t.dataset.id;

    switch(action){
      case 'go-department':
        ui.tab='department'; relockAllStudents(); persistUIState(); renderApp(); break;
      case 'go-welcome':
        ui.tab='welcome'; ui.authed=false; ui.currentTeacherId=null; ui.loginError=null; relockAllStudents(); persistUIState(); closeModal(); renderApp(); break;
      case 'go-back':
        if(ui.tab==='classroom'){ ui.tab='department'; }
        else if(ui.tab==='faculty'){ ui.tab='department'; }
        else if(ui.tab==='subject'){
          var sub=subjectById(ui.subjectId);
          if(sub && isFaculty(sub)){ ui.tab='faculty'; }
          else{ ui.tab='classroom'; ui.classroomId=sub?sub.classroomId:ui.classroomId; ui.classroomSubTab='subjects'; }
        }
        else if(ui.tab==='student'){ var stu=studentById(ui.studentId); ui.tab='classroom'; ui.classroomId=stu?stu.classroomId:ui.classroomId; ui.classroomSubTab='students'; }
        else{ ui.tab='department'; }
        if(ui.tab==='department') relockAllStudents();
        persistUIState(); renderApp(); break;
      case 'go-classroom':
        ui.tab='classroom'; ui.classroomId=id; ui.classroomSubTab='students'; persistUIState(); renderApp(); break;
      case 'go-faculty':
        ui.tab='faculty'; ui.facultySubTab='teachers'; persistUIState(); renderApp(); break;
      case 'go-myprofile':
        if(!ui.currentTeacherId) break;
        ui.tab='myprofile'; ui.myProfileTab='materials'; persistUIState(); closeModal(); renderApp(); break;
      case 'set-myprofile-tab':
        ui.myProfileTab = t.dataset.tab; persistUIState(); renderApp(); break;
      case 'dtr-clock':
        var dtrSlot = clockDTR(ui.currentTeacherId);
        if(dtrSlot){ logActivity('Recorded '+DTR_SLOT_LABELS[dtrSlot]+' time.'); renderApp(); queueSave(); }
        break;
      case 'dtr-prev-month':
        if(!ui.dtrMonth) ui.dtrMonth = todayISO().slice(0,7);
        ui.dtrMonth = shiftMonth(ui.dtrMonth, -1); renderApp(); break;
      case 'dtr-next-month':
        if(!ui.dtrMonth) ui.dtrMonth = todayISO().slice(0,7);
        ui.dtrMonth = shiftMonth(ui.dtrMonth, 1); renderApp(); break;
      case 'edit-dtr-row':
        var dtrRowRec = state.dtr.find(function(r){return r.id===id;});

      case 'confirm-delete-dtr-row':

        });

          modalConfirm('Unlock all?', 'These records will allow editing and deletion until locked again.', 'confirm-unlock-all', id+'|'+genderForLock, 'Unlock all', 'btn-primary');

  /* ---------------------------- init ---------------------------- */
  function init(){
    applyStoredTheme();
    loadInitialState();
    if(syncAllSubjectTeachersFromTimetable()) queueSave();
    loadUIState();
    renderApp();
    checkForNewChatTone();
    checkScheduleAlerts();
    setInterval(checkScheduleAlerts, 20000);

    whenFirebaseReady(function(fb){
      if(!fb){ setSaveStatus('local'); return; }
      fbApi = fb;
      fbApi.onState(function(remote){
        if(remote){ state = normalizeState(remote); renderApp(); }
        else { queueSave(); }
      });
      setSaveStatus('idle');
    });
  }
